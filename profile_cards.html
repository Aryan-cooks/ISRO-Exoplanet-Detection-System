<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Profile Cards</title>
  <style>
    /* ProfileCard.css */
    :root {
      --pointer-x: 50%;
      --pointer-y: 50%;
      --pointer-from-center: 0;
      --pointer-from-top: 0.5;
      --pointer-from-left: 0.5;
      --card-opacity: 0;
      --rotate-x: 0deg;
      --rotate-y: 0deg;
      --background-x: 50%;
      --background-y: 50%;
      --grain: none;
      --icon: none;
      --behind-gradient: none;
      --behind-glow-color: rgba(125, 190, 255, 0.67);
      --behind-glow-size: 25%;
      --inner-gradient: none;
      --sunpillar-1: hsl(2, 100%, 73%);
      --sunpillar-2: hsl(53, 100%, 69%);
      --sunpillar-3: hsl(93, 100%, 69%);
      --sunpillar-4: hsl(176, 100%, 76%);
      --sunpillar-5: hsl(228, 100%, 74%);
      --sunpillar-6: hsl(283, 100%, 73%);
      --sunpillar-clr-1: var(--sunpillar-1);
      --sunpillar-clr-2: var(--sunpillar-2);
      --sunpillar-clr-3: var(--sunpillar-3);
      --sunpillar-clr-4: var(--sunpillar-4);
      --sunpillar-clr-5: var(--sunpillar-5);
      --sunpillar-clr-6: var(--sunpillar-6);
      --card-radius: 30px;
    }

    body {
      margin: 0;
      padding: 10px;
      background: transparent;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    .cards-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 2.5rem;
      max-width: 1100px;
      margin: 0 auto;
      padding: 10px;
    }

    .pc-card-wrapper {
      perspective: 500px;
      transform: translate3d(0, 0, 0.1px);
      position: relative;
      touch-action: none;
      width: 100%;
      flex: 1 1 250px;
      max-width: 300px;
    }

    .pc-behind {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(
        circle at var(--pointer-x) var(--pointer-y),
        var(--behind-glow-color) 0%,
        transparent var(--behind-glow-size)
      );
      filter: blur(50px) saturate(1.1);
      opacity: calc(0.8 * var(--card-opacity));
      transition: opacity 200ms ease;
    }

    .pc-card-wrapper:hover,
    .pc-card-wrapper.active {
      --card-opacity: 1;
    }

    .pc-card {
      width: 100%;
      height: auto;
      max-height: none;
      display: grid;
      aspect-ratio: 0.718;
      border-radius: var(--card-radius);
      position: relative;
      background-blend-mode: color-dodge, normal, normal, normal;
      animation: glow-bg 12s linear infinite;
      box-shadow: rgba(0, 0, 0, 0.8) calc((var(--pointer-from-left) * 10px) - 3px)
        calc((var(--pointer-from-top) * 20px) - 6px) 20px -5px;
      transition: transform 1s ease;
      transform: translateZ(0) rotateX(0deg) rotateY(0deg);
      background: rgba(0, 0, 0, 0.9);
      backface-visibility: hidden;
      overflow: hidden;
      width: 100%;
    }

    .pc-card:hover,
    .pc-card.active {
      transition: none;
      transform: translateZ(0) rotateX(var(--rotate-y)) rotateY(var(--rotate-x));
    }

    .pc-card-shell.entering .pc-card {
      transition: transform 180ms ease-out;
    }

    .pc-card-shell {
      position: relative;
      z-index: 1;
      width: 100%;
    }

    .pc-card * {
      display: grid;
      grid-area: 1/-1;
      border-radius: var(--card-radius);
      pointer-events: none;
    }

    .pc-inside {
      inset: 0;
      position: absolute;
      background-image: var(--inner-gradient);
      background-color: rgba(0, 0, 0, 0.9);
      transform: none;
    }

    .pc-shine {
      display: none !important;
    }

    .pc-shine,
    .pc-shine::after {
      --space: 5%;
      --angle: -45deg;
      transform: translate3d(0, 0, 1px);
      overflow: hidden;
      z-index: 3;
      background: transparent;
      background-size: cover;
      background-position: center;
      background-image:
        repeating-linear-gradient(
          0deg,
          var(--sunpillar-clr-1) calc(var(--space) * 1),
          var(--sunpillar-clr-2) calc(var(--space) * 2),
          var(--sunpillar-clr-3) calc(var(--space) * 3),
          var(--sunpillar-clr-4) calc(var(--space) * 4),
          var(--sunpillar-clr-5) calc(var(--space) * 5),
          var(--sunpillar-clr-6) calc(var(--space) * 6),
          var(--sunpillar-clr-1) calc(var(--space) * 7)
        ),
        repeating-linear-gradient(
          var(--angle),
          #0e152e 0%,
          hsl(180, 10%, 60%) 3.8%,
          hsl(180, 29%, 66%) 4.5%,
          hsl(180, 10%, 60%) 5.2%,
          #0e152e 10%,
          #0e152e 12%
        ),
        radial-gradient(
          farthest-corner circle at var(--pointer-x) var(--pointer-y),
          hsla(0, 0%, 0%, 0.1) 12%,
          hsla(0, 0%, 0%, 0.15) 20%,
          hsla(0, 0%, 0%, 0.25) 120%
        );
      background-position:
        0 var(--background-y),
        var(--background-x) var(--background-y),
        center;
      background-blend-mode: color, hard-light;
      background-size:
        500% 500%,
        300% 300%,
        200% 200%;
      background-repeat: repeat;
    }

    .pc-shine::before,
    .pc-shine::after {
      content: '';
      background-position: center;
      background-size: cover;
      grid-area: 1/1;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .pc-card:hover .pc-shine,
    .pc-card.active .pc-shine {
      filter: brightness(0.85) contrast(1.5) saturate(0.5);
      animation-play-state: paused;
    }

    .pc-card:hover .pc-shine::before,
    .pc-card.active .pc-shine::before,
    .pc-card:hover .pc-shine::after,
    .pc-card.active .pc-shine::after {
      opacity: 1;
    }

    .pc-shine::before {
      background-image:
        linear-gradient(
          45deg,
          var(--sunpillar-4),
          var(--sunpillar-5),
          var(--sunpillar-6),
          var(--sunpillar-1),
          var(--sunpillar-2),
          var(--sunpillar-3)
        ),
        radial-gradient(circle at var(--pointer-x) var(--pointer-y), hsl(0, 0%, 70%) 0%, hsla(0, 0%, 30%, 0.2) 90%),
        var(--grain);
      background-size:
        250% 250%,
        100% 100%,
        220px 220px;
      background-position:
        var(--pointer-x) var(--pointer-y),
        center,
        calc(var(--pointer-x) * 0.01) calc(var(--pointer-y) * 0.01);
      background-blend-mode: color-dodge;
      filter: brightness(calc(1.1 - var(--pointer-from-center)*0.3)) contrast(calc(var(--pointer-from-center)*0.5 + 1))
        saturate(calc(0.5 + var(--pointer-from-center)));
      mix-blend-mode: overlay;
    }

    .pc-shine::after {
      background-position:
        0 var(--background-y),
        calc(var(--background-x) * 0.4) calc(var(--background-y) * 0.5),
        center;
      background-size:
        200% 300%,
        700% 700%,
        100% 100%;
      mix-blend-mode: difference;
      filter: brightness(0.8) contrast(1.5);
    }

    .pc-glare {
      transform: translate3d(0, 0, 1.1px);
      overflow: hidden;
      background-image: radial-gradient(
        farthest-corner circle at var(--pointer-x) var(--pointer-y),
        hsl(248, 25%, 80%) 12%,
        hsla(207, 40%, 30%, 0.8) 90%
      );
      mix-blend-mode: overlay;
      filter: brightness(0.3) contrast(1);
      z-index: 4;
    }

    .pc-avatar-content {
      mix-blend-mode: normal;
      overflow: visible;
      transform: translateZ(2);
      backface-visibility: hidden;
    }

    .pc-avatar-content .avatar {
      width: 100%;
      position: absolute;
      left: 50%;
      transform-origin: 50% 100%;
      transform: translateX(calc(-50% + (var(--pointer-from-left) - 0.5) * 6px)) translateZ(0)
        scaleY(calc(1 + (var(--pointer-from-top) - 0.5) * 0.02)) scaleX(calc(1 + (var(--pointer-from-left) - 0.5) * 0.01));
      bottom: -1px;
      backface-visibility: hidden;
      will-change: transform;
      transition: transform 120ms ease-out;
    }

    .pc-avatar-content::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      backdrop-filter: none;
      pointer-events: none;
    }

    .pc-user-info {
      position: absolute;
      --ui-inset: 16px;
      --ui-radius-bias: 6px;
      bottom: var(--ui-inset);
      left: var(--ui-inset);
      right: var(--ui-inset);
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: calc(max(0px, var(--card-radius) - var(--ui-inset) + var(--ui-radius-bias)));
      padding: 10px 12px;
      pointer-events: auto;
    }

    .pc-user-details {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .pc-mini-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    .pc-mini-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .pc-user-text {
      display: flex;
      align-items: flex-start;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
      width: 100%;
    }

    .pc-handle {
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .pc-status {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1;
    }

    .pc-contact-btn {
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: transparent;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(10px);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .pc-contact-btn:hover {
      border-color: rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-1px);
    }

    .pc-content:not(.pc-avatar-content) {
      max-height: 100%;
      overflow: hidden;
      text-align: center;
      position: relative;
      transform: translate3d(
        calc(var(--pointer-from-left) * -6px + 3px),
        calc(var(--pointer-from-top) * -6px + 3px),
        0.1px
      );
      z-index: 5;
    }

    .pc-details {
      width: 100%;
      position: absolute;
      top: 3em;
      display: flex;
      flex-direction: column;
    }

    .pc-details h3 {
      font-weight: 700;
      margin: 0;
      font-size: 1.6rem;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8), 0 0 20px rgba(0,0,0,0.5);
      letter-spacing: -0.02em;
    }

    .pc-details p {
      font-weight: 600;
      font-size: 0.95rem;
      margin: 0.4rem auto 0;
      color: #93c5fd;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    @keyframes glow-bg {
      0% { --bgrotate: 0deg; }
      100% { --bgrotate: 360deg; }
    }

    @keyframes holo-bg {
      0% {
        background-position: 0 var(--background-y), 0 0, center;
      }
      100% {
        background-position: 0 var(--background-y), 90% 90%, center;
      }
    }

    @media (max-width: 768px) {
      .pc-card {
        height: 50svh;
        max-height: 400px;
      }
      .pc-details { top: 2em; }
      .pc-details h3 { font-size: min(4svh, 2em); }
      .pc-details p { font-size: 14px; }
      .pc-user-info { --ui-inset: 15px; padding: 10px 12px; }
      .pc-mini-avatar { width: 28px; height: 28px; }
      .pc-user-details { gap: 10px; }
      .pc-handle { font-size: 13px; }
      .pc-status { font-size: 10px; }
      .pc-contact-btn { padding: 6px 12px; font-size: 11px; }
    }
  </style>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useRef, useCallback, useMemo } = React;

    const DEFAULT_INNER_GRADIENT = 'linear-gradient(145deg,#60496e8c 0%,#71C4FF44 100%)';

    const ANIMATION_CONFIG = {
      INITIAL_DURATION: 1200,
      INITIAL_X_OFFSET: 70,
      INITIAL_Y_OFFSET: 60,
      DEVICE_BETA_OFFSET: 20,
      ENTER_TRANSITION_MS: 180
    };

    const clamp = (v, min = 0, max = 100) => Math.min(Math.max(v, min), max);
    const round = (v, precision = 3) => parseFloat(v.toFixed(precision));
    const adjust = (v, fMin, fMax, tMin, tMax) => round(tMin + ((tMax - tMin) * (v - fMin)) / (fMax - fMin));

    const ProfileCardComponent = ({
      avatarUrl = 'https://i.pravatar.cc/300?u=a',
      iconUrl = '',
      grainUrl = '',
      innerGradient,
      behindGlowEnabled = true,
      behindGlowColor,
      behindGlowSize,
      className = '',
      enableTilt = true,
      enableMobileTilt = false,
      mobileTiltSensitivity = 5,
      miniAvatarUrl,
      name = 'Javi A. Torres',
      title = 'Software Engineer',
      handle = 'javicodes',
      status = 'Online',
      contactText = 'Contact',
      showUserInfo = true,
      onContactClick
    }) => {
      const wrapRef = useRef(null);
      const shellRef = useRef(null);

      const enterTimerRef = useRef(null);
      const leaveRafRef = useRef(null);

      const tiltEngine = useMemo(() => {
        if (!enableTilt) return null;

        let rafId = null;
        let running = false;
        let lastTs = 0;

        let currentX = 0;
        let currentY = 0;
        let targetX = 0;
        let targetY = 0;

        const DEFAULT_TAU = 0.14;
        const INITIAL_TAU = 0.6;
        let initialUntil = 0;

        const setVarsFromXY = (x, y) => {
          const shell = shellRef.current;
          const wrap = wrapRef.current;
          if (!shell || !wrap) return;

          const width = shell.clientWidth || 1;
          const height = shell.clientHeight || 1;

          const percentX = clamp((100 / width) * x);
          const percentY = clamp((100 / height) * y);

          const centerX = percentX - 50;
          const centerY = percentY - 50;

          const properties = {
            '--pointer-x': `${percentX}%`,
            '--pointer-y': `${percentY}%`,
            '--background-x': `${adjust(percentX, 0, 100, 35, 65)}%`,
            '--background-y': `${adjust(percentY, 0, 100, 35, 65)}%`,
            '--pointer-from-center': `${clamp(Math.hypot(percentY - 50, percentX - 50) / 50, 0, 1)}`,
            '--pointer-from-top': `${percentY / 100}`,
            '--pointer-from-left': `${percentX / 100}`,
            '--rotate-x': `${round(-(centerX / 5))}deg`,
            '--rotate-y': `${round(centerY / 4)}deg`
          };

          for (const [k, v] of Object.entries(properties)) wrap.style.setProperty(k, v);
        };

        const step = ts => {
          if (!running) return;
          if (lastTs === 0) lastTs = ts;
          const dt = (ts - lastTs) / 1000;
          lastTs = ts;

          const tau = ts < initialUntil ? INITIAL_TAU : DEFAULT_TAU;
          const k = 1 - Math.exp(-dt / tau);

          currentX += (targetX - currentX) * k;
          currentY += (targetY - currentY) * k;

          setVarsFromXY(currentX, currentY);

          const stillFar = Math.abs(targetX - currentX) > 0.05 || Math.abs(targetY - currentY) > 0.05;

          if (stillFar || document.hasFocus()) {
            rafId = requestAnimationFrame(step);
          } else {
            running = false;
            lastTs = 0;
            if (rafId) {
              cancelAnimationFrame(rafId);
              rafId = null;
            }
          }
        };

        const start = () => {
          if (running) return;
          running = true;
          lastTs = 0;
          rafId = requestAnimationFrame(step);
        };

        return {
          setImmediate(x, y) {
            currentX = x;
            currentY = y;
            setVarsFromXY(currentX, currentY);
          },
          setTarget(x, y) {
            targetX = x;
            targetY = y;
            start();
          },
          toCenter() {
            const shell = shellRef.current;
            if (!shell) return;
            this.setTarget(shell.clientWidth / 2, shell.clientHeight / 2);
          },
          beginInitial(durationMs) {
            initialUntil = performance.now() + durationMs;
            start();
          },
          getCurrent() {
            return { x: currentX, y: currentY, tx: targetX, ty: targetY };
          },
          cancel() {
            if (rafId) cancelAnimationFrame(rafId);
            rafId = null;
            running = false;
            lastTs = 0;
          }
        };
      }, [enableTilt]);

      const getOffsets = (evt, el) => {
        const rect = el.getBoundingClientRect();
        return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
      };

      const handlePointerMove = useCallback(
        event => {
          const shell = shellRef.current;
          if (!shell || !tiltEngine) return;
          const { x, y } = getOffsets(event, shell);
          tiltEngine.setTarget(x, y);
        },
        [tiltEngine]
      );

      const handlePointerEnter = useCallback(
        event => {
          const shell = shellRef.current;
          if (!shell || !tiltEngine) return;

          shell.classList.add('active');
          shell.classList.add('entering');
          if (enterTimerRef.current) window.clearTimeout(enterTimerRef.current);
          enterTimerRef.current = window.setTimeout(() => {
            shell.classList.remove('entering');
          }, ANIMATION_CONFIG.ENTER_TRANSITION_MS);

          const { x, y } = getOffsets(event, shell);
          tiltEngine.setTarget(x, y);
        },
        [tiltEngine]
      );

      const handlePointerLeave = useCallback(() => {
        const shell = shellRef.current;
        if (!shell || !tiltEngine) return;

        tiltEngine.toCenter();

        const checkSettle = () => {
          const { x, y, tx, ty } = tiltEngine.getCurrent();
          const settled = Math.hypot(tx - x, ty - y) < 0.6;
          if (settled) {
            shell.classList.remove('active');
            leaveRafRef.current = null;
          } else {
            leaveRafRef.current = requestAnimationFrame(checkSettle);
          }
        };
        if (leaveRafRef.current) cancelAnimationFrame(leaveRafRef.current);
        leaveRafRef.current = requestAnimationFrame(checkSettle);
      }, [tiltEngine]);

      const handleDeviceOrientation = useCallback(
        event => {
          const shell = shellRef.current;
          if (!shell || !tiltEngine) return;

          const { beta, gamma } = event;
          if (beta == null || gamma == null) return;

          const centerX = shell.clientWidth / 2;
          const centerY = shell.clientHeight / 2;
          const x = clamp(centerX + gamma * mobileTiltSensitivity, 0, shell.clientWidth);
          const y = clamp(
            centerY + (beta - ANIMATION_CONFIG.DEVICE_BETA_OFFSET) * mobileTiltSensitivity,
            0,
            shell.clientHeight
          );

          tiltEngine.setTarget(x, y);
        },
        [tiltEngine, mobileTiltSensitivity]
      );

      useEffect(() => {
        if (!enableTilt || !tiltEngine) return;

        const shell = shellRef.current;
        if (!shell) return;

        const pointerMoveHandler = handlePointerMove;
        const pointerEnterHandler = handlePointerEnter;
        const pointerLeaveHandler = handlePointerLeave;
        const deviceOrientationHandler = handleDeviceOrientation;

        shell.addEventListener('pointerenter', pointerEnterHandler);
        shell.addEventListener('pointermove', pointerMoveHandler);
        shell.addEventListener('pointerleave', pointerLeaveHandler);

        const handleClick = () => {
          if (!enableMobileTilt || window.location.protocol !== 'https:') return;
          const anyMotion = window.DeviceMotionEvent;
          if (anyMotion && typeof anyMotion.requestPermission === 'function') {
            anyMotion
              .requestPermission()
              .then(state => {
                if (state === 'granted') {
                  window.addEventListener('deviceorientation', deviceOrientationHandler);
                }
              })
              .catch(console.error);
          } else {
            window.addEventListener('deviceorientation', deviceOrientationHandler);
          }
        };
        shell.addEventListener('click', handleClick);

        const initialX = (shell.clientWidth || 0) - ANIMATION_CONFIG.INITIAL_X_OFFSET;
        const initialY = ANIMATION_CONFIG.INITIAL_Y_OFFSET;
        tiltEngine.setImmediate(initialX, initialY);
        tiltEngine.toCenter();
        tiltEngine.beginInitial(ANIMATION_CONFIG.INITIAL_DURATION);

        return () => {
          shell.removeEventListener('pointerenter', pointerEnterHandler);
          shell.removeEventListener('pointermove', pointerMoveHandler);
          shell.removeEventListener('pointerleave', pointerLeaveHandler);
          shell.removeEventListener('click', handleClick);
          window.removeEventListener('deviceorientation', deviceOrientationHandler);
          if (enterTimerRef.current) window.clearTimeout(enterTimerRef.current);
          if (leaveRafRef.current) cancelAnimationFrame(leaveRafRef.current);
          tiltEngine.cancel();
          shell.classList.remove('entering');
        };
      }, [
        enableTilt,
        enableMobileTilt,
        tiltEngine,
        handlePointerMove,
        handlePointerEnter,
        handlePointerLeave,
        handleDeviceOrientation
      ]);

      const cardStyle = useMemo(
        () => ({
          '--icon': iconUrl ? `url(${iconUrl})` : 'none',
          '--grain': grainUrl ? `url(${grainUrl})` : 'none',
          '--inner-gradient': innerGradient ?? DEFAULT_INNER_GRADIENT,
          '--behind-glow-color': behindGlowColor ?? 'rgba(125, 190, 255, 0.67)',
          '--behind-glow-size': behindGlowSize ?? '50%'
        }),
        [iconUrl, grainUrl, innerGradient, behindGlowColor, behindGlowSize]
      );

      const handleContactClick = useCallback(() => {
        onContactClick?.();
      }, [onContactClick]);

      return (
        <div ref={wrapRef} className={`pc-card-wrapper ${className}`.trim()} style={cardStyle}>
          {behindGlowEnabled && <div className="pc-behind" />}
          <div ref={shellRef} className="pc-card-shell">
            <section className="pc-card">
              <div className="pc-inside">
                <div className="pc-shine" />
                <div className="pc-glare" />
                <div className="pc-content pc-avatar-content">
                  <img
                    className="avatar"
                    src={avatarUrl}
                    alt={`${name || 'User'} avatar`}
                    loading="lazy"
                    onError={e => {
                      const t = e.target;
                      t.style.display = 'none';
                    }}
                  />
                  {showUserInfo && (
                    <div className="pc-user-info">
                      <div className="pc-user-details">
                        <div className="pc-mini-avatar">
                          <img
                            src={miniAvatarUrl || avatarUrl}
                            alt={`${name || 'User'} mini avatar`}
                            loading="lazy"
                            onError={e => {
                              const t = e.target;
                              t.style.opacity = '0.5';
                              t.src = avatarUrl;
                            }}
                          />
                        </div>
                        <div className="pc-user-text">
                          <div className="pc-handle">@{handle}</div>
                          <div className="pc-status">{status}</div>
                        </div>
                      </div>
                      <button
                        className="pc-contact-btn"
                        onClick={handleContactClick}
                        style={{ pointerEvents: 'auto' }}
                        type="button"
                        aria-label={`Contact ${name || 'user'}`}
                      >
                        {contactText}
                      </button>
                    </div>
                  )}
                </div>
                <div className="pc-content">
                  <div className="pc-details">
                    <h3>{name}</h3>
                    <p>{title}</p>
                  </div>
                </div>
              </div>
            </section>
          </div>
        </div>
      );
    };

    const ProfileCard = React.memo(ProfileCardComponent);

    const App = () => {
      const handleContact = (name) => {
        console.log(`Contact ${name}`);
      };

      return (
        <div className="cards-container">
          <ProfileCard 
            name="Anushka Singh" 
            title="Team Member" 
            handle="anushka_singh" 
            avatarUrl="https://i.pravatar.cc/300?img=47" 
            contactText="View GitHub"
            onContactClick={() => handleContact("Anushka Singh")}
          />
          <ProfileCard 
            name="Aryan Shrivastava" 
            title="Team Member" 
            handle="aryan_shrivastava" 
            avatarUrl="https://i.pravatar.cc/300?img=11" 
            contactText="View GitHub"
            onContactClick={() => handleContact("Aryan Shrivastava")}
          />
          <ProfileCard 
            name="Anushka Sah" 
            title="Team Member" 
            handle="anushka_sah" 
            avatarUrl="https://i.pravatar.cc/300?img=33" 
            contactText="View GitHub"
            onContactClick={() => handleContact("Anushka Sah")}
          />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
